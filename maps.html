<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Video trên Bản đồ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 100vh; /* Chiều cao bản đồ */
            width: 100%; /* Chiều rộng bản đồ */
        }

        /* Popup video styling */
        .video-popup {
            width: 300px;
        }

        .video-popup iframe {
            width: 100%;
            height: 200px;
            border: none;
        }

        .video-popup .details {
            margin-top: 10px;
        }

        .video-popup .details h3 {
            font-size: 16px;
            margin: 5px 0;
        }

        .video-popup .details p {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Khởi tạo bản đồ
        const map = L.map('map').setView([10.7769, 106.7009], 13); // Tọa độ TP.HCM

        // Thêm lớp bản đồ từ OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Dữ liệu video (có thể thay đổi)
        const videoData = [
            {
                coords: [10.7769, 106.7009], // Tọa độ marker
                youtubeUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ", // Link nhúng YouTube
                title: "Rick Astley - Never Gonna Give You Up",
                description: "Video âm nhạc nổi tiếng của Rick Astley."
            },
            {
                coords: [10.762622, 106.660172], // Tọa độ marker
                hlsUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", // Link HLS
                title: "HLS Video Demo",
                description: "Đây là một video HLS demo để kiểm tra phát trực tuyến."
            }
        ];

        // Hàm tạo popup video
        function createVideoPopup(video) {
            let videoEmbed = '';

            // Kiểm tra loại video (YouTube hoặc HLS)
            if (video.youtubeUrl) {
                videoEmbed = `<iframe src="${video.youtubeUrl}" allowfullscreen></iframe>`;
            } else if (video.hlsUrl) {
                videoEmbed = `<video controls autoplay style="width: 100%; height: 200px;">
                                <source src="${video.hlsUrl}" type="application/x-mpegURL">
                                Trình duyệt của bạn không hỗ trợ video HLS.
                              </video>`;
            }

            // Nội dung popup
            return `
                <div class="video-popup">
                    ${videoEmbed}
                    <div class="details">
                        <h3>${video.title}</h3>
                        <p>${video.description}</p>
                    </div>
                </div>
            `;
        }

        // Thêm marker và popup vào bản đồ
        videoData.forEach(video => {
            const marker = L.marker(video.coords).addTo(map);
            marker.bindPopup(createVideoPopup(video), { maxWidth: 300 });
        });
    </script>
</body>
</html>
